name: Talkivana — content generation

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass today's deduplication and pending-pack cap"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: talkivana-daily-content
  cancel-in-progress: false

jobs:
  preflight:
    name: Parent agent — safety preflight
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TALKIVANA_CONTENT_AUTOMATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Validate configuration without enabling publication
        run: python -c "from language_video_automation.config import load_config; load_config(); print('Configuration schema valid')"

  content:
    name: Content generation + Standard German QA
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      issue_number: ${{ steps.generate.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - id: generate
        name: Generate two Shorts and two linked conversations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m language_video_automation draft --repo "$GITHUB_REPOSITORY" --force --output build/draft-result.json
          else
            python -m language_video_automation draft --repo "$GITHUB_REPOSITORY" --output build/draft-result.json
          fi
          ISSUE_NUMBER="$(jq -r '.issue_number // empty' build/draft-result.json)"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Explain a failed content run
        if: failure()
        run: |
          echo "## Content generation failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed generation step and find the last line beginning with **Gemini stage**." >> "$GITHUB_STEP_SUMMARY"
          echo "It now identifies the exact phase, attempt, elapsed time, and safe provider error." >> "$GITHUB_STEP_SUMMARY"

  automatic_production:
    name: Start unattended production after all content gates pass
    needs: content
    if: ${{ needs.content.outputs.issue_number != '' && vars.TALKIVANA_UNATTENDED_AUTOMATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the trusted production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.content.outputs.issue_number }}
        run: >-
          gh workflow run process-approval.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          --field "issue_number=$ISSUE_NUMBER"

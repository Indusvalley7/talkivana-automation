name: Talkivana — title uniqueness guard

on:
  push:
    branches: [main]
    paths:
      - "config/channel.json"
      - "src/language_video_automation/titles.py"
      - "src/language_video_automation/pipeline.py"
      - "src/language_video_automation/youtube.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: talkivana-title-uniqueness
  cancel-in-progress: false

jobs:
  reconcile:
    name: Audit headings → safely rename private collisions → refresh tracker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Apply reviewed corrections only to private scheduled videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m language_video_automation reconcile-titles --repo "$GITHUB_REPOSITORY"
      - name: Refresh the repository tracker with the actual YouTube headings
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m language_video_automation sync-tracker --repo "$GITHUB_REPOSITORY"

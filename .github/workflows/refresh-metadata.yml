name: Talkivana — refresh private metadata

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue containing the complete private four-video pack"
        required: true
        default: "1"

permissions:
  contents: read
  issues: write

concurrency:
  group: talkivana-refresh-metadata-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Apply approved descriptions to all four videos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Update descriptions without rendering or scheduling
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m language_video_automation refresh-metadata
          --repo "$GITHUB_REPOSITORY"
          --issue "${{ inputs.issue_number }}"
